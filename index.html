<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모래더미 프랙탈</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>모래더미 프랙탈 <small>Abelian sandpile</small></h1>
  <nav>
    <button class="tab on" data-tab="play">놀기</button>
    <button class="tab" data-tab="explain">어떻게 작동하나</button>
  </nav>
</header>

<main id="play" class="page on">
  <section class="stage">
    <div class="canvas-wrap"><canvas id="cv" width="800" height="800"></canvas>
      <div id="badge" class="badge">준비</div>
    </div>
    <p class="hint">캔버스를 누르거나 끌면 그 자리에 모래가 쏟아져요.</p>
  </section>

  <aside class="panel">
    <div class="group">
      <h2>무엇을 해볼까</h2>
      <div class="presets">
        <button data-preset="center" class="on">가운데에 쏟기</button>
        <button data-preset="drip">조금씩 붓기</button>
        <button data-preset="identity">항등원 그리기</button>
        <button data-preset="critical">3으로 가득 + 한 알</button>
        <button data-preset="soc">눈사태 관찰</button>
      </div>
      <p id="presetNote" class="note"></p>
    </div>

    <div class="group" id="gCenter">
      <label>모래 알 수 <b id="nLabel"></b></label>
      <input id="nSlider" type="range" min="10" max="20" step="1" value="16">
      <button id="go" class="primary">쏟기</button>
    </div>

    <div class="group hidden" id="gGrid">
      <label>격자 크기 <b id="gLabel"></b></label>
      <input id="gSlider" type="range" min="6" max="9" step="1" value="8">
      <button id="go2" class="primary">다시 시작</button>
    </div>

    <div class="group">
      <label>속도 <b id="sLabel"></b></label>
      <input id="speed" type="range" min="0" max="10" step="1" value="10">
      <div class="row">
        <button id="pause">멈춤</button>
        <button id="clear">비우기</button>
        <button id="save">이미지 저장</button>
      </div>
    </div>

    <div class="group">
      <h2>보기</h2>
      <div class="seg" id="view">
        <button data-v="0" class="on">모래 높이</button>
        <button data-v="1">무너진 횟수</button>
      </div>
      <div class="seg" id="pal">
        <button data-p="sand" class="on">사막</button>
        <button data-p="classic">클래식</button>
        <button data-p="ink">먹</button>
      </div>
      <div class="seg" id="rule">
        <button data-r="4" class="on">4방향 (4개면 무너짐)</button>
        <button data-r="8">8방향 (8개면)</button>
      </div>
    </div>

    <div class="group stats">
      <h2>지금 상태</h2>
      <div class="legend" id="legend"></div>
      <dl>
        <dt>남은 모래</dt><dd id="stGrains">–</dd>
        <dt>무너진 횟수 합</dt><dd id="stTopples">–</dd>
        <dt>계산 패스</dt><dd id="stPasses">–</dd>
      </dl>
      <div id="socBox" class="hidden">
        <h3>눈사태 크기 분포 <small>(로그-로그)</small></h3>
        <canvas id="socPlot" width="300" height="160"></canvas>
        <p class="note" id="socNote"></p>
      </div>
    </div>
  </aside>
</main>

<main id="explain" class="page"></main>

<script type="module" src="app.js"></script>
</body>
</html>
